name: Publish debug APK

# Builds the Android debug APK and publishes it as the "debug-latest" GitHub
# Release, so it can be downloaded directly on a phone.
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.32.x', cache: true }
      - name: Build debug APK
        run: |
          flutter pub get
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            flutter build apk --debug \
              --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          else
            flutter build apk --debug
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk StrideMate-debug.apk
      - name: Publish release "debug-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest StrideMate-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "StrideMate debug APK (latest)" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. For testing only. Open this page on your Android phone, tap StrideMate-debug.apk, and allow installs from your browser when asked."

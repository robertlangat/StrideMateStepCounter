name: Store screenshots

# Runs StrideMate on an Android emulator with sample data and captures the
# screens used for the Play Store listing.
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths: ['lib/**', 'integration_test/**', 'test_driver/**', '.github/workflows/screenshots.yml']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.32.x', cache: true }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554 --dart-define=DEMO_DATA=true --dart-define=ADS_ENABLED=false > drive.log 2>&1 || (tail -c 60000 drive.log; exit 1)
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch drive.log
          gh release delete store-screenshots-log --yes --cleanup-tag || true
          gh release create store-screenshots-log drive.log --prerelease --target "$GITHUB_SHA" --title "Screenshot run log" --notes "log"
      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l screenshots
          (cd screenshots && zip -q ../StrideMate-screenshots-raw.zip *.png)
          gh release delete store-screenshots --yes --cleanup-tag || true
          gh release create store-screenshots StrideMate-screenshots-raw.zip --prerelease --target "$GITHUB_SHA" \
            --title "Raw store screenshots" --notes "Emulator screenshots with sample data (${GITHUB_SHA::7})."

name: Foreground service demo video

# Records the Play Console demo video for the "Live counting" foreground service.
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths: ['integration_test/fgs_demo_test.dart', 'scripts/record_fgs_demo.sh', '.github/workflows/fgs-video.yml', 'android/app/src/main/kotlin/**']

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.32.x', cache: true }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash scripts/record_fgs_demo.sh
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch fgs.log
          files="fgs.log"; [ -f fgs-demo.mp4 ] && files="$files fgs-demo.mp4"
          gh release delete fgs-demo-video --yes --cleanup-tag || true
          gh release create fgs-demo-video $files --prerelease --target "$GITHUB_SHA" --title "Foreground service demo video" --notes "Raw emulator recording (${GITHUB_SHA::7})."
